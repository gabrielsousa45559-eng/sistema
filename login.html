<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>Entrar — NexoFlow</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{font-family:'DM Sans',sans-serif;color:#172541;background:#f7f9fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.side{display:grid;place-items:center;padding:32px}.card{width:min(420px,100%);padding:36px;background:#fff;border:1px solid #e8edf4;border-radius:15px;box-shadow:0 22px 70px #263c6610}.logo{display:inline-flex;margin-bottom:26px}.logo img{width:155px;height:47px;object-fit:contain;object-position:left center}.eyebrow{font-size:9px;font-weight:700;letter-spacing:1.4px;color:#74819a}.card h1{font:800 27px 'Manrope',sans-serif;letter-spacing:-.9px;margin:10px 0 7px}.intro{margin:0 0 22px;font-size:12px;line-height:1.7;color:#8591a3}.field{display:grid;gap:7px;margin-top:13px}.field span{font-size:10px;font-weight:700;color:#5b6880}.field input,.field select{height:42px;padding:0 12px;border:1px solid #dfe5ef;border-radius:7px;font:12px 'DM Sans',sans-serif;outline-color:#7b8ef0;background:white}.submit{width:100%;height:43px;margin-top:19px;border:0;border-radius:7px;background:#526de5;color:white;font:700 12px 'DM Sans',sans-serif;cursor:pointer}.submit:hover{background:#425ed8}.error{min-height:18px;margin:11px 0 0;color:#c64e52;font-size:10px;line-height:1.5}.links{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:10px;color:#8d99aa}.links a{color:#526de5;text-decoration:none;font-weight:600}.art{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:11%;background:linear-gradient(145deg,#1d315e,#405cbe 62%,#6079e8);color:white}.art:before,.art:after{content:'';position:absolute;border:1px solid #ffffff20;border-radius:50%;width:580px;height:580px;right:-190px;top:-170px}.art:after{width:420px;height:420px;right:-107px;top:-90px}.copy{position:relative;z-index:1;max-width:440px}.mark{font-size:31px;color:#59d1a9}.copy h2{font:800 38px/1.17 'Manrope',sans-serif;letter-spacing:-1.5px;margin:18px 0 12px}.copy p{font-size:13px;line-height:1.8;color:#dce5ff;max-width:380px}.bottom{position:absolute;bottom:31px;left:11%;font-size:9px;color:#cfdaff}.plan-note{padding:10px 11px;margin-top:14px;border-radius:6px;background:#f4f6ff;color:#6678c7;font-size:10px;line-height:1.6}@media(max-width:760px){body{grid-template-columns:1fr}.side{min-height:100vh;padding:20px}.card{padding:29px 25px}.art{display:none}}
</style></head><body><main class="side"><section class="card"><a class="logo" href="sales-page.html"><img src="nexoflow-logo.png" alt="NexoFlow"></a><div class="eyebrow" id="eyebrow">ACESSO AO SISTEMA</div><h1 id="title">Que bom ter você de volta.</h1><p class="intro" id="intro">Entre com seu e-mail e senha para acessar o NexoFlow.</p><form id="authForm"><div id="extraFields"></div><label class="field"><span>E-mail</span><input name="email" type="email" autocomplete="username" required placeholder="voce@empresa.com.br"></label><label class="field"><span>Senha</span><input name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Mínimo de 8 caracteres"></label><button class="submit" id="submit">Entrar</button><div class="error" id="error" role="alert"></div></form><div class="links"><a href="sales-page.html">← Página comercial</a><a id="switchMode" href="signup.html">Criar conta</a></div><div class="plan-note" id="planNote" hidden></div></section></main><aside class="art"><div class="copy"><span class="mark">✳</span><h2>Seu negócio em fluxo.</h2><p>Uma visão conectada de vendas, estoque, financeiro e serviços para sua equipe seguir em frente.</p></div><div class="bottom">NexoFlow · Gestão que acompanha sua rotina</div></aside><script>
const form=document.getElementById('authForm'),error=document.getElementById('error'),params=new URLSearchParams(location.search),signup=location.pathname.endsWith('signup.html')||params.get('mode')==='signup',plan=params.get('plan')||'start';if(signup){document.title='Criar conta — NexoFlow';document.getElementById('eyebrow').textContent='COMECE A USAR O NEXOFLOW';document.getElementById('title').textContent='Crie a conta da sua empresa.';document.getElementById('intro').textContent='Cadastre o administrador e entre no seu ambiente de gestão.';document.getElementById('submit').textContent='Criar conta e entrar';document.getElementById('switchMode').textContent='Já tenho conta';document.getElementById('switchMode').href='login.html';document.getElementById('extraFields').innerHTML='<label class="field"><span>Seu nome</span><input name="name" required autocomplete="name" placeholder="Nome completo"></label><label class="field"><span>Nome da empresa</span><input name="company" required autocomplete="organization" placeholder="Sua empresa"></label><label class="field"><span>Plano</span><select name="plan"><option value="start">Essencial</option><option value="pro">Pro</option><option value="multi">Multiunidade</option></select></label><label class="field"><span>Confirmar senha</span><input name="confirm_password" type="password" required minlength="8" autocomplete="new-password" placeholder="Digite novamente"></label>';document.querySelector('[name="password"]').autocomplete='new-password';document.querySelector('[name="password"]').placeholder='Crie uma senha segura';document.querySelector('[name="plan"]').value=plan;const prices={start:'R$ 79',pro:'R$ 149',multi:'R$ 299'};const note=document.getElementById('planNote');note.hidden=false;note.textContent=`Plano selecionado: ${prices[plan]||prices.start}/mês. Preço demonstrativo; cobrança online ainda não configurada.`;document.querySelector('[name="plan"]').addEventListener('change',e=>{note.textContent=`Plano selecionado: ${prices[e.target.value]}/mês. Preço demonstrativo; cobrança online ainda não configurada.`})}else if(params.get('next')==='admin'){document.getElementById('switchMode').hidden=true}
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const body=Object.fromEntries(new FormData(form));if(signup&&body.password!==body.confirm_password){error.textContent='As senhas não conferem.';return}delete body.confirm_password;try{const response=await fetch(signup?'/api/auth/signup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível concluir.');location.href=params.get('next')==='admin'?'/admin.html':'/index.html#overview'}catch(err){error.textContent=location.protocol==='file:'?'Abra o NexoFlow pelo iniciar.bat para criar conta ou entrar.':err.message}});
</script></body></html>
